name: Website CI/CD

on:
  push:
    paths:
      - 'tayfun-dereyurt/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'tayfun-dereyurt/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tayfun-dereyurt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tayfun-dereyurt/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tayfun-dereyurt/package-lock.json
      - run: npm ci
        working-directory: tayfun-dereyurt
      - run: npm run build
        working-directory: tayfun-dereyurt
        env:
          DEPLOY_TARGET: github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tayfun-dereyurt/dist
      - id: deployment
        uses: actions/deploy-pages@v5
